<!doctype html>
<!-- 홍보영상 촬영용 틀. 녹화는 CSS 픽셀 기준이라 화면 배율이 반영되지 않습니다.
     그래서 540px 짜리 휴대폰 화면을 2배로 늘린 1080px 판 위에 올립니다.
     글자는 늘어난 크기로 다시 그려지므로 또렷합니다. -->
<html lang="ko"><head><meta charset="utf-8"><title>promo</title>
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#fff}
  iframe{width:540px;height:960px;border:0;display:block;
         transform:scale(2);transform-origin:0 0}
</style></head>
<body><iframe id="app" src="/"></iframe></body></html>
