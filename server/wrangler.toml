name = "unfollog-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# 관리자 화면 열쇠. 아래 명령으로 넣습니다 (코드에 적지 마세요).
#   npx wrangler secret put ADMIN_KEY
#
# 사이트 주소. 다른 곳에서 함부로 기록을 쌓지 못하게 막습니다.
[vars]
ALLOWED_ORIGIN = "https://unfollog.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "unfollog"
database_id = "여기에-d1-만든-뒤-나온-id"
