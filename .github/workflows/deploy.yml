# 기본 브랜치에 올리면 검사하고 GitHub Pages 로 배포합니다.
#
# Pages 가 꺼져 있으면 아래 configure-pages 가 켭니다(enablement).
# 저장소가 비공개이면 이 단계가 "Resource not accessible by integration" 으로
# 실패합니다. 그때는 저장소를 공개로 바꾸거나, Settings → Pages → Source 를
# "GitHub Actions" 로 직접 바꿔야 합니다.
name: deploy

on:
  push:
    branches: [ccr-fed3e512-uj8jsj, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돌립니다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 검사가 하나라도 깨지면 배포하지 않습니다.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
