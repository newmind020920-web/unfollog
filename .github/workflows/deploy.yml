# 기본 브랜치에 올리면 검사하고 GitHub Pages 로 배포합니다.
#
# 처음 한 번은 사람이 켜야 합니다:
#   저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로.
# 워크플로가 자동으로 켜 보려 했지만 기본 토큰에는 Pages 생성 권한이 없어
# "Resource not accessible by integration" 으로 실패합니다.
# 켠 다음에는 이 워크플로를 다시 실행하면 됩니다(Actions → 실패한 실행 → Re-run).
name: deploy

on:
  push:
    branches: [ccr-fed3e512-uj8jsj, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돌립니다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 검사가 하나라도 깨지면 배포하지 않습니다.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
