# 기본 브랜치에 올리면 검사하고 GitHub Pages 로 배포합니다.
#
# Pages 가 꺼져 있으면 아래 configure-pages 가 켭니다(enablement).
# 저장소가 비공개이면 이 단계가 "Resource not accessible by integration" 으로
# 실패합니다. 그때는 저장소를 공개로 바꾸거나, Settings → Pages → Source 를
# "GitHub Actions" 로 직접 바꿔야 합니다.
name: deploy

on:
  push:
    branches: [ccr-fed3e512-uj8jsj, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돌립니다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 검사가 하나라도 깨지면 배포하지 않습니다.
      - run: npm run typecheck
      - run: npm test
      # 집계 주소가 들어왔는지 값은 감추고 확인합니다.
      # Variables 와 Secrets 둘 중 어디에 넣어도 되게 해 둡니다.
      - name: check VITE_API_URL
        env:
          FROM_VARS: ${{ vars.VITE_API_URL }}
          FROM_SECRETS: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -n "$FROM_VARS" ]; then
            echo "VITE_API_URL: Variables 에서 찾음 (${#FROM_VARS}자)"
          elif [ -n "$FROM_SECRETS" ]; then
            echo "VITE_API_URL: Secrets 에서 찾음 (${#FROM_SECRETS}자)"
          else
            echo "VITE_API_URL 이 비어 있음 — 방문 집계 없이 빌드합니다."
            echo "  Settings → Secrets and variables → Actions → Variables 에 추가하세요."
          fi

      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
